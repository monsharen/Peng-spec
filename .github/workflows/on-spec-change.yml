# Triggered when Gherkin feature specs or the manifest changes.
# Validates the intent integrity chain, then dispatches a rebuild to Peng.

name: "Intent Chain → Dispatch Build"

on:
  push:
    branches: [main]
    paths:
      - "peng.spec.yaml"
      - "features/**/*.feature"
  pull_request:
    paths:
      - "peng.spec.yaml"
      - "features/**/*.feature"

jobs:
  validate-spec:
    name: Validate intent chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify intent integrity chain
        run: python3 verify-chain.py

  dispatch-build:
    name: Trigger Peng rebuild
    needs: validate-spec
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need parent commit for diff analysis

      - name: Compute chain hash and detect previous SHA
        id: meta
        run: |
          pip install pyyaml

          HASH=$(python3 -c "
          import hashlib, yaml
          from pathlib import Path
          spec = yaml.safe_load(open('peng.spec.yaml'))
          h = hashlib.sha256(Path('peng.spec.yaml').read_bytes())
          for iid in sorted(spec.get('intents', {})):
              f = spec['intents'][iid].get('file')
              if f and Path(f).exists():
                  h.update(Path(f).read_bytes())
          print(h.hexdigest())
          ")
          echo "chain_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Chain hash: $HASH"

          BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "0000000000000000000000000000000000000000")
          echo "before_sha=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Before SHA: $BEFORE"

          # List changed features for logging
          git diff --name-only HEAD~1 HEAD -- 'features/*.feature' || true

      - name: Dispatch to Peng repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PENG_REPO_TOKEN }}
          repository: monsharen/Peng
          event-type: spec-changed
          client-payload: |
            {
              "spec_repo": "${{ github.repository }}",
              "spec_sha": "${{ github.sha }}",
              "spec_ref": "${{ github.ref }}",
              "before_sha": "${{ steps.meta.outputs.before_sha }}",
              "chain_hash": "${{ steps.meta.outputs.chain_hash }}",
              "triggered_by": "${{ github.actor }}"
            }
