# Peng – Intent Integrity Chain Manifest
# =======================================
# This manifest registers all Gherkin feature files and defines
# the intent hierarchy. The actual specs live in features/*.feature.
#
# Flow: edit features → verify-chain.py → push → CI validates → dispatch rebuild

version: "1.0"
spec_name: peng
repository: monsharen/Peng

# --- Intent Tree ---
# Maps intent IDs to their Gherkin feature files.
# Tags inside each .feature file encode: @<intent-id> @parent:<id> @status:<status>

intents:
  intent-root:
    title: "Peng – Core Purpose"
    description: >
      Define the top-level purpose of the Peng project here.
      All features must trace back to this root intent.
    children:
      - intent-feature-001
      - intent-feature-002

  intent-feature-001:
    file: features/feature-001-example.feature
    parent: intent-root
    children: []

  intent-feature-002:
    file: features/feature-002-example.feature
    parent: intent-root
    children: []

# --- Integrity ---
integrity:
  algorithm: sha256
  chain_hash: "PENDING"
  last_verified: null

# --- Build Dispatch ---
build:
  target_repo: monsharen/Peng
  trigger_on:
    - "peng.spec.yaml"
    - "features/**/*.feature"
  build_command: "npm run build"
  test_command: "npm test"
