# Peng – Intent Integrity Chain Specification
# ===========================================
# This file is the single source of truth for what Peng should be.
# Every intent links to child intents forming a traceable chain.
# When any intent changes, downstream implementation must be re-verified.
#
# The chain guarantees: Purpose → Features → Behavior → Contracts → Verification
# If a link breaks, the agent flags it and triggers a rebuild.

version: "1.0"
spec_name: peng
repository: monsharen/Peng

# --- Intent Integrity Chain ---

chain:

  # Level 0: Root intent – WHY does Peng exist?
  - id: intent-root
    level: 0
    title: "Peng – Core Purpose"
    description: >
      Define the top-level purpose of the Peng project here.
      This is the anchor of the entire integrity chain.
      All downstream intents must trace back to this root.
    status: draft
    acceptance_criteria:
      - "The system fulfils the core purpose described here"
    children:
      - intent-feature-001
      - intent-feature-002

  # Level 1: Feature intents – WHAT capabilities are needed?
  - id: intent-feature-001
    level: 1
    parent: intent-root
    title: "Feature 1 – [Name]"
    description: >
      Describe the first major feature or capability here.
    status: draft
    acceptance_criteria:
      - "Criterion 1"
      - "Criterion 2"
    children:
      - intent-behavior-001

  - id: intent-feature-002
    level: 1
    parent: intent-root
    title: "Feature 2 – [Name]"
    description: >
      Describe the second major feature or capability here.
    status: draft
    acceptance_criteria:
      - "Criterion 1"
    children: []

  # Level 2: Behavioral specs – HOW should each feature behave?
  - id: intent-behavior-001
    level: 2
    parent: intent-feature-001
    title: "Behavior – [Name]"
    description: >
      Describe the expected behavior in detail.
      Include edge cases and error scenarios.
    status: draft
    acceptance_criteria:
      - "Given X, when Y, then Z"
    contracts:
      - intent-contract-001

  # Level 3: Contracts – WHAT interfaces connect spec to implementation?
  - id: intent-contract-001
    level: 3
    parent: intent-behavior-001
    title: "Contract – [API/Interface Name]"
    description: >
      Define the interface, API, data structures, or protocol
      that the implementation must expose.
    status: draft
    interface: |
      # Example: function signature, API endpoint, message format, etc.
      # fn example(input: Input) -> Output
    verification:
      type: test
      command: "echo 'replace with actual test command'"

# --- Integrity Metadata ---
# The agent computes these hashes to detect when the chain has changed.
# On any change, a rebuild of the peng repo is triggered.

integrity:
  algorithm: sha256
  chain_hash: "PENDING"  # Computed by the agent on each commit
  last_verified: null
  last_build_trigger: null

# --- Build Dispatch ---
# Configuration for triggering the peng repo build.

build:
  target_repo: monsharen/Peng
  trigger_on:
    - "peng.spec.yaml"
    - "intents/**/*.yaml"
  build_command: "npm run build"  # Adjust to actual build command
  test_command: "npm test"        # Adjust to actual test command
